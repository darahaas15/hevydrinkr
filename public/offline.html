<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Drinkr — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-user-select: none; user-select: none;
    }
    .c { text-align: center; padding: 2rem; max-width: 320px; }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 1.5rem;
      border-radius: 16px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #71717a; font-size: 0.875rem; line-height: 1.5; margin-bottom: 2rem; }
    button {
      background: linear-gradient(135deg, #14b8a6, #06b6d4);
      color: #fff; border: none;
      padding: 0.875rem 2.5rem; border-radius: 1rem;
      font-weight: 600; font-size: 0.875rem;
      cursor: pointer; position: relative;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: default; }
    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    .retrying .spinner { display: inline-block; }
    .retrying button { display: none; }
    .status {
      margin-top: 1.5rem; font-size: 0.75rem; color: #52525b;
      min-height: 1.2em;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="c" id="container">
    <div class="icon">&#127867;</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your session data is saved locally.</p>
    <button id="retry" onclick="retry()">Retry</button>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
  </div>
  <script>
    function retry() {
      var c = document.getElementById('container');
      var s = document.getElementById('status');
      c.classList.add('retrying');
      s.textContent = 'Reconnecting...';

      fetch(window.location.href, { cache: 'no-store' })
        .then(function(r) {
          if (r.ok) window.location.reload();
          else throw new Error('still offline');
        })
        .catch(function() {
          c.classList.remove('retrying');
          s.textContent = 'Still offline. Try again in a moment.';
        });
    }

    // Auto-retry when connectivity returns
    window.addEventListener('online', function() {
      document.getElementById('status').textContent = 'Connection restored!';
      setTimeout(function() { window.location.reload(); }, 500);
    });
  </script>
</body>
</html>
